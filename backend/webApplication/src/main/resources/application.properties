spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#turning off docker compose because we didnt need to use it now
spring.docker.compose.enabled=false

jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

otp.length=${VERIFICATION_CODE_LENGTH}
otp.expiration-min=${VERIFICATION_CODE_EXPIRATION_MIN}
otp.resend-cooldown-min=${VERIFICATION_RESEND_COOLDOWN_MINUTES}
otp.secret=${ALPHANUMERIC_CHARACTERS}
otp.max-attempts=${VERIFICATION_CODE_MAX_ATTEMPTS:5}

# Resend SMTP (leave RESEND_API_KEY blank for local console OTP fallback)
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.mail.resend-api-key=${RESEND_API_KEY:}